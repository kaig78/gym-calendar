<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Calendar 2026</title>
<style>
:root {
  --bg: #f3efe7;
  --bg-2: #e8efe8;
  --surface: rgba(255,255,255,0.82);
  --surface-strong: #ffffff;
  --text: #1f2a2e;
  --muted: #66757b;
  --line: rgba(31,42,46,0.12);
  --shadow: 0 18px 50px rgba(20,28,30,0.10);
  --accent: #2e7d5b;
  --accent-soft: rgba(46,125,91,0.14);
  --fat-color: #5c8fd8;
  --fat-soft: rgba(92,143,216,0.14);
  --warn-soft: rgba(227,157,45,0.16);
  --good-soft: rgba(66,163,111,0.16);
  --start-color: #d95f6b;
  --weekend: #f7f3eb;
  --font-body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: Georgia, "Times New Roman", serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1418;--bg-2:#121b17;
    --surface:rgba(23,31,36,0.82);--surface-strong:#18212a;
    --text:#e9f0f4;--muted:#8ca0ac;--line:rgba(233,240,244,0.12);
    --shadow:0 18px 50px rgba(0,0,0,0.35);--weekend:#161e18;
    --accent-soft:rgba(46,125,91,0.22);--fat-soft:rgba(92,143,216,0.22);
    --good-soft:rgba(66,163,111,0.22);--warn-soft:rgba(227,157,45,0.22);
  }
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;min-height:100vh;font-family:var(--font-body);color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(255,208,153,0.35),transparent 38%),
    radial-gradient(circle at top right,rgba(149,194,255,0.28),transparent 32%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
}
button,input{font:inherit;}
button{border:0;background:none;color:inherit;cursor:pointer;}
input{border:0;outline:none;}

.app{width:min(1200px,calc(100vw - 24px));margin:12px auto 40px;}

/* HERO */
.hero{
  position:relative;overflow:hidden;padding:28px 28px 24px;
  border:1px solid var(--line);border-radius:28px;
  background:linear-gradient(135deg,rgba(255,255,255,0.65),rgba(255,255,255,0.28));
  box-shadow:var(--shadow);backdrop-filter:blur(12px);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:999px;pointer-events:none;}
.hero::before{width:240px;height:240px;right:-70px;top:-100px;background:radial-gradient(circle,rgba(255,200,77,0.36),transparent 65%);}
.hero::after{width:280px;height:280px;left:-130px;bottom:-160px;background:radial-gradient(circle,rgba(92,143,216,0.16),transparent 68%);}
.eyebrow{text-transform:uppercase;letter-spacing:0.16em;color:var(--muted);font-size:12px;font-weight:700;}
.title-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:8px;}
h1{margin:0;font-family:var(--font-display);font-style:italic;font-size:clamp(2.4rem,5vw,5.2rem);line-height:0.94;letter-spacing:-0.03em;}
.subtitle{max-width:500px;margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.5;}
.sync-badge{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.3s;}
.sync-dot.syncing{background:#e39d2d;animation:pulse 1s infinite;}
.sync-dot.saved{background:var(--accent);}
.sync-dot.error{background:#d95f6b;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;}
.legend-item{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,0.38);border:1px solid var(--line);}

/* GOALS */
.goals-card{
  margin-top:18px;border:1px solid var(--line);border-radius:26px;overflow:hidden;
  background:rgba(255,255,255,0.42);box-shadow:var(--shadow);backdrop-filter:blur(10px);
}
.goals-head{display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,0.28),transparent);}
.goals-head strong{font-family:var(--font-display);font-style:italic;font-size:1.3rem;}
.goals-head small{color:var(--muted);font-size:13px;}
.goals-body{display:flex;gap:20px;padding:20px 24px;flex-wrap:wrap;align-items:flex-start;}
.goals-group{display:grid;gap:10px;}
.goals-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
.goals-row{display:flex;gap:10px;flex-wrap:wrap;}
.goals-field{display:grid;gap:5px;}
.goals-field label{font-size:11px;font-weight:700;color:var(--muted);}
.goals-input{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-strong);color:var(--text);font-size:14px;font-weight:700;width:130px;transition:border-color 0.15s,box-shadow 0.15s;}
.goals-input.wide{width:180px;}
.goals-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;}
.goals-divider{width:1px;background:var(--line);margin:0 4px;align-self:stretch;}

/* CHARTS */
.charts-section{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.chart-card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:rgba(255,255,255,0.42);box-shadow:var(--shadow);backdrop-filter:blur(10px);}
.chart-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.chart-head strong{font-family:var(--font-display);font-style:italic;font-size:1.1rem;}
.chart-meta{display:flex;gap:12px;font-size:12px;color:var(--muted);}
.chart-meta b{font-weight:800;}
.chart-body{padding:10px 12px 14px;}
.chart-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;margin:0;}

/* CALENDAR */
.calendar{margin-top:18px;display:grid;gap:18px;}
.month{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,0.40);box-shadow:var(--shadow);backdrop-filter:blur(10px);}
.month-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,0.28),transparent);}
.month-title strong{font-family:var(--font-display);font-style:italic;font-size:1.75rem;line-height:1;}
.month-stats{display:flex;flex-wrap:wrap;gap:8px;}
.stat{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;}
.stat b{font-size:14px;}
.scroll-x{overflow-x:auto;}
.month-grid{min-width:900px;}
.week-header,.week-row{display:grid;grid-template-columns:60px repeat(7,minmax(90px,1fr)) 14px 200px;}
.week-header{border-bottom:1px solid var(--line);background:rgba(255,255,255,0.26);}
.week-header div{padding:8px;text-align:center;text-transform:uppercase;letter-spacing:0.08em;font-size:11px;color:var(--muted);font-weight:800;}
.week-gap{background:transparent!important;}
.week-row{border-bottom:1px solid var(--line);}
.week-row:last-child{border-bottom:0;}
.week-label{padding:8px;border-right:1px solid var(--line);background:rgba(255,255,255,0.22);display:grid;place-items:center;text-align:center;}
.week-label strong{display:block;font-size:0.9rem;line-height:1;}
.week-label small{margin-top:3px;color:var(--muted);font-size:9px;line-height:1.4;}

/* DAY CELLS — compact */
.day{min-height:82px;padding:6px 7px 5px;border-right:1px solid var(--line);background:rgba(255,255,255,0.16);}
.day.weekend{background:var(--weekend);}
.day.other-month{opacity:0.35;background:rgba(255,255,255,0.06);}
.day.today{box-shadow:inset 0 0 0 2px rgba(46,125,91,0.32);}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:5px;margin-bottom:6px;}
.day-num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;font-weight:800;font-size:11px;background:var(--surface);border:1px solid var(--line);}
.day-name{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;font-weight:800;}
.activity-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.activity-row:last-child{margin-bottom:0;}
.activity-tag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:9px;font-weight:900;background:var(--surface-strong);border:1px solid var(--line);color:var(--muted);flex-shrink:0;}
.toggle{flex:1;height:26px;border-radius:7px;border:1.5px solid var(--accent);background:rgba(255,255,255,0.22);display:grid;place-items:center;transition:transform 100ms ease,background 100ms ease;cursor:pointer;font-size:13px;}
.toggle:hover{transform:translateY(-1px);}
.toggle.on{background:var(--good-soft);box-shadow:0 3px 10px rgba(46,125,91,0.16);}

/* MEASURE COLUMN */
.measure{padding:8px 10px;background:rgba(255,255,255,0.22);border-left:1px solid var(--line);}
.measure-metric{margin-bottom:6px;}
.measure-metric:last-child{margin-bottom:0;}
.measure-metric-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:2px;}
.measure-input{width:100%;min-height:26px;padding:0 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface-strong);color:var(--text);font-weight:700;font-size:12px;margin-bottom:3px;display:block;transition:border-color 0.15s;}
.measure-input:focus{outline:none;}
.measure-input.kg-inp:focus{border-color:var(--accent);}
.measure-input.fat-inp:focus{border-color:var(--fat-color);}
.rem-badge{display:block;width:100%;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:800;text-align:center;}
.rem-badge.good{background:var(--good-soft);color:#27724f;}
.rem-badge.warn{background:var(--warn-soft);color:#9a6a10;}
.rem-badge.neutral{background:rgba(102,117,123,0.10);color:var(--muted);}
.rem-badge.done{background:var(--good-soft);color:#27724f;}

.footer{margin:20px 2px 0;color:var(--muted);font-size:13px;text-align:center;}

@media(max-width:900px){
  .charts-section{grid-template-columns:1fr;}
  .app{width:min(100vw - 12px,1200px);margin-top:6px;}
  .hero{padding:20px 16px 18px;}
}
</style>
</head>
<body>
<div class="app">

  <section class="hero">
    <div class="eyebrow">May – December 2026</div>
    <div class="title-row">
      <div>
        <h1>Gym Calendar</h1>
      </div>
      <span id="syncDot" style="display:none"></span>
    </div>
  </section>

  <!-- GOALS -->
  <section class="goals-card">
    <div class="goals-head">
      <strong>Startmaße &amp; Ziele</strong>
    </div>
    <div class="goals-body">
      <input id="gName" type="hidden" value="Kai" />
      <div class="goals-group">
        <div class="goals-group-label">⚖️ Gewicht (kg)</div>
        <div class="goals-row">
          <div class="goals-field">
            <label for="gStartKg">Start</label>
            <input class="goals-input" id="gStartKg" type="text" inputmode="decimal" placeholder="z. B. 94" />
          </div>
          <div class="goals-field">
            <label for="gGoalKg">Ziel</label>
            <input class="goals-input" id="gGoalKg" type="text" inputmode="decimal" placeholder="z. B. 85" />
          </div>
        </div>
      </div>
      <div class="goals-divider"></div>
      <div class="goals-group">
        <div class="goals-group-label">🔥 Körperfett (%)</div>
        <div class="goals-row">
          <div class="goals-field">
            <label for="gStartFat">Start</label>
            <input class="goals-input" id="gStartFat" type="text" inputmode="decimal" placeholder="z. B. 25" />
          </div>
          <div class="goals-field">
            <label for="gGoalFat">Ziel</label>
            <input class="goals-input" id="gGoalFat" type="text" inputmode="decimal" placeholder="z. B. 18" />
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CHARTS -->
  <div class="charts-section">
    <div class="chart-card">
      <div class="chart-head">
        <strong>⚖️ Gewichtsverlauf</strong>
        <div class="chart-meta" id="chartKgMeta"></div>
      </div>
      <div class="chart-body" id="chartKgBody"></div>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <strong>🔥 Körperfett</strong>
        <div class="chart-meta" id="chartFatMeta"></div>
      </div>
      <div class="chart-body" id="chartFatBody"></div>
    </div>
  </div>

  <main class="calendar" id="calendar"></main>

  <div class="footer">Daten → Notion · lokal gecacht in <code>localStorage</code></div>
</div>

<script>
const STORAGE_KEY = 'gym-cal-v4';
const API_URL = '/api/data';

const MONTHS = [
  {year:2026,month:4,name:'May'},
  {year:2026,month:5,name:'June'},
  {year:2026,month:6,name:'July'},
  {year:2026,month:7,name:'August'},
  {year:2026,month:8,name:'September'},
  {year:2026,month:9,name:'October'},
  {year:2026,month:10,name:'November'},
  {year:2026,month:11,name:'December'},
];
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const todayKey = fmtDate(new Date());
let saveTimer=null, notionTimer=null;

// ── State ─────────────────────────────────────────────
const state = loadLocal();
state.name     = state.name     ?? 'Kai';
state.startKg  = state.startKg  ?? '';
state.goalKg   = state.goalKg   ?? '';
state.startFat = state.startFat ?? '';
state.goalFat  = state.goalFat  ?? '';
state.days     = state.days     || {};
state.measures = state.measures || {};

// Migrate old format
Object.keys(state.measures).forEach(wk=>{
  const v=state.measures[wk];
  if(typeof v==='string'||typeof v==='number') state.measures[wk]={kg:String(v),fat:''};
  else if(Array.isArray(v)) state.measures[wk]={kg:String(v[0]||''),fat:''};
});

// ── Persistence ───────────────────────────────────────
function loadLocal(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');}catch{return{};}}
function saveLocal(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state)),80);}
function setSyncStatus(s){ /* silent */ }
async function pushToNotion(){
  clearTimeout(notionTimer);
  notionTimer=setTimeout(async()=>{
    setSyncStatus('syncing');
    try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});setSyncStatus(r.ok?'saved':'error');}
    catch{setSyncStatus('error');}
  },1800);
}
async function pullFromNotion(){
  try{
    const r=await fetch(API_URL);
    if(!r.ok){setSyncStatus('error');return;}
    const d=await r.json();
    if(!d||typeof d!=='object'){setSyncStatus('saved');return;}
    ['name','startKg','goalKg','startFat','goalFat'].forEach(k=>{if(d[k]!==undefined)state[k]=d[k];});
    if(d.days)Object.assign(state.days,d.days);
    if(d.measures){
      Object.assign(state.measures,d.measures);
      Object.keys(state.measures).forEach(wk=>{
        const v=state.measures[wk];
        if(typeof v==='string'||typeof v==='number')state.measures[wk]={kg:String(v),fat:''};
        else if(Array.isArray(v))state.measures[wk]={kg:String(v[0]||''),fat:''};
      });
    }
    saveLocal();applyGoalsToUI();renderCalendar();renderCharts();setSyncStatus('saved');
  }catch{setSyncStatus('error');}
}
function scheduleSave(){saveLocal();pushToNotion();}

// ── Remaining ─────────────────────────────────────────
function remKg(val){const g=parseFloat(state.goalKg),c=parseFloat(val);if(isNaN(g)||isNaN(c))return null;return Math.round((c-g)*10)/10;}
function remFat(val){const g=parseFloat(state.goalFat),c=parseFloat(val);if(isNaN(g)||isNaN(c))return null;return Math.round((c-g)*10)/10;}
function applyRemBadge(el,rem,unit){
  if(rem===null){el.textContent='—';el.className='rem-badge neutral';return;}
  if(rem<=0){el.textContent='🎯 Ziel erreicht!';el.className='rem-badge done';return;}
  el.textContent=`noch ${rem}${unit}`;
  el.className='rem-badge '+(rem<=2?'warn':'good');
}
function refreshAllBadges(){
  document.querySelectorAll('[data-rem]').forEach(el=>{
    const wk=el.dataset.rem,metric=el.dataset.metric,val=state.measures[wk]?.[metric]??'';
    if(metric==='kg')applyRemBadge(el,remKg(val),' kg');
    else applyRemBadge(el,remFat(val),'%');
  });
}

// ── Goals UI ──────────────────────────────────────────
function applyGoalsToUI(){
  document.getElementById('gName').value    =state.name||'';
  document.getElementById('gStartKg').value =state.startKg||'';
  document.getElementById('gGoalKg').value  =state.goalKg||'';
  document.getElementById('gStartFat').value=state.startFat||'';
  document.getElementById('gGoalFat').value =state.goalFat||'';
}
function bindGoal(id,key,cb){document.getElementById(id).addEventListener('input',e=>{state[key]=e.target.value;cb();scheduleSave();});}
bindGoal('gName',    'name',    ()=>renderCalendar());
bindGoal('gStartKg', 'startKg', ()=>renderCharts());
bindGoal('gGoalKg',  'goalKg',  ()=>{refreshAllBadges();renderCharts();});
bindGoal('gStartFat','startFat',()=>renderCharts());
bindGoal('gGoalFat', 'goalFat', ()=>{refreshAllBadges();renderCharts();});

// ── Charts ────────────────────────────────────────────
function getAllWeekStarts(){
  const seen=new Set(),result=[];
  MONTHS.forEach(({year,month})=>getWeeks(year,month).forEach(w=>{const k=fmtDate(w[0]);if(!seen.has(k)){seen.add(k);result.push(k);}}));
  return result.sort();
}

function buildSvg(wks, getVal, goalVal, startVal, lineColor){
  const n=wks.length;
  const points=wks.map((wk,i)=>{const v=getVal(wk);return v!==null?{i,v}:null;}).filter(Boolean);

  const allVals=[...points.map(p=>p.v)];
  if(!isNaN(goalVal))  allVals.push(goalVal);
  if(!isNaN(startVal)) allVals.push(startVal);
  if(allVals.length===0) return null;

  const rawMin=Math.min(...allVals), rawMax=Math.max(...allVals);
  const pad=Math.max((rawMax-rawMin)*0.08, 0.5);
  const minY=rawMin-pad, maxY=rawMax+pad;
  const rangeY=maxY-minY||1;

  // SVG coordinate space
  const W=100, H=62, pl=18, pr=5, pt=5, pb=6;
  const cW=W-pl-pr, cH=H-pt-pb;
  const xOf=i=>pl+(i/(n-1||1))*cW;
  const yOf=v=>pt+cH-((v-minY)/rangeY)*cH;

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible" font-family="ui-sans-serif,system-ui,sans-serif">`;

  // Y-axis labels + grid lines (4 levels)
  const yLevels=4;
  for(let i=0;i<yLevels;i++){
    const v=minY+(rangeY/(yLevels-1))*i;
    const y=yOf(v).toFixed(2);
    const label=v%1===0?v.toFixed(0):v.toFixed(1);
    svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="currentColor" stroke-width="0.2" opacity="0.09"/>`;
    svg+=`<text x="${pl-1.5}" y="${(parseFloat(y)+0.9).toFixed(2)}" font-size="3.5" fill="currentColor" opacity="0.38" text-anchor="end">${label}</text>`;
  }

  // Y-axis line
  svg+=`<line x1="${pl}" y1="${pt}" x2="${pl}" y2="${pt+cH}" stroke="currentColor" stroke-width="0.3" opacity="0.15"/>`;

  // Goal dashed line + label
  if(!isNaN(goalVal)){
    const gy=yOf(goalVal).toFixed(2);
    svg+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="${lineColor}" stroke-width="0.5" stroke-dasharray="1.8,1.2" opacity="0.55"/>`;
    svg+=`<text x="${W-pr+1}" y="${(parseFloat(gy)+1).toFixed(2)}" font-size="3" fill="${lineColor}" opacity="0.75" text-anchor="start">Ziel</text>`;
  }

  // Area fill + line
  if(points.length>1){
    const coords=points.map(p=>`${xOf(p.i).toFixed(2)},${yOf(p.v).toFixed(2)}`).join(' ');
    const f=points[0],la=points[points.length-1];
    svg+=`<path d="M${xOf(f.i).toFixed(2)},${(pt+cH).toFixed(2)} L${coords} L${xOf(la.i).toFixed(2)},${(pt+cH).toFixed(2)} Z" fill="${lineColor}" opacity="0.07"/>`;
    const d=points.map((p,j)=>`${j===0?'M':'L'}${xOf(p.i).toFixed(2)},${yOf(p.v).toFixed(2)}`).join(' ');
    svg+=`<path d="${d}" fill="none" stroke="${lineColor}" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  // Data dots
  points.forEach(p=>{
    svg+=`<circle cx="${xOf(p.i).toFixed(2)}" cy="${yOf(p.v).toFixed(2)}" r="1.5" fill="${lineColor}"/>`;
  });

  // Start dot — red, at leftmost x position
  if(!isNaN(startVal)){
    const sx=pl.toFixed(2), sy=yOf(startVal).toFixed(2);
    svg+=`<circle cx="${sx}" cy="${sy}" r="2" fill="#d95f6b" stroke="white" stroke-width="0.5"/>`;
    svg+=`<text x="${parseFloat(sx)+3}" y="${(parseFloat(sy)+1).toFixed(2)}" font-size="3" fill="#d95f6b" opacity="0.85">Start</text>`;
  }

  svg+='</svg>';
  return svg;
}

function renderCharts(){
  const wks=getAllWeekStarts();

  const goalKg=parseFloat(state.goalKg), startKg=parseFloat(state.startKg);
  const svgKg=buildSvg(wks,wk=>{const v=parseFloat(state.measures[wk]?.kg);return isNaN(v)?null:v;},goalKg,startKg,'#2e7d5b');
  document.getElementById('chartKgBody').innerHTML=svgKg||'<p class="chart-empty">Noch keine Gewichtsdaten</p>';
  const km=document.getElementById('chartKgMeta');km.innerHTML='';
  if(!isNaN(startKg))km.innerHTML+=`<span>Start <b>${startKg} kg</b></span>`;
  if(!isNaN(goalKg)) km.innerHTML+=`<span>Ziel <b>${goalKg} kg</b></span>`;

  const goalFat=parseFloat(state.goalFat), startFat=parseFloat(state.startFat);
  const svgFat=buildSvg(wks,wk=>{const v=parseFloat(state.measures[wk]?.fat);return isNaN(v)?null:v;},goalFat,startFat,'#5c8fd8');
  document.getElementById('chartFatBody').innerHTML=svgFat||'<p class="chart-empty">Noch keine Fettdaten</p>';
  const fm=document.getElementById('chartFatMeta');fm.innerHTML='';
  if(!isNaN(startFat))fm.innerHTML+=`<span>Start <b>${startFat}%</b></span>`;
  if(!isNaN(goalFat)) fm.innerHTML+=`<span>Ziel <b>${goalFat}%</b></span>`;
}

// ── Calendar ──────────────────────────────────────────
function renderCalendar(){
  const root=document.getElementById('calendar');
  root.innerHTML='';

  MONTHS.forEach(({year,month,name})=>{
    const weeks=getWeeks(year,month);
    const sec=el('section','month');
    sec.innerHTML=`
      <div class="month-head">
        <div class="month-title"><strong>${name} ${year}</strong></div>
        <div class="month-stats" data-stats="${year}-${month}"></div>
      </div>`;

    const scroll=el('div','scroll-x');
    const grid=el('div','month-grid');
    const hdr=el('div','week-header');
    hdr.innerHTML=`<div>Wk</div>${DAY_NAMES.map(d=>`<div>${d}</div>`).join('')}<div class="week-gap"></div><div>kg · %Fett</div>`;
    grid.appendChild(hdr);

    weeks.forEach(week=>{
      const wStart=week[0],wEnd=week[6];
      const wk=fmtDate(wStart);
      if(!state.measures[wk]||typeof state.measures[wk]!=='object')
        state.measures[wk]={kg:'',fat:''};

      const row=el('div','week-row');
      const wLabel=el('div','week-label');
      wLabel.innerHTML=`<strong>W${weekNum(wStart)}</strong><small>${wStart.getDate()}/${wStart.getMonth()+1}<br>${wEnd.getDate()}/${wEnd.getMonth()+1}</small>`;
      row.appendChild(wLabel);

      week.forEach(date=>{
        const key=fmtDate(date);
        const inMonth=date.getMonth()===month;
        const ds=ensureDay(key);
        const dayEl=el('div',[
          'day',
          !inMonth?'other-month':'',
          (date.getDay()===0||date.getDay()===6)?'weekend':'',
          key===todayKey?'today':'',
        ].filter(Boolean).join(' '));

        dayEl.innerHTML=`<div class="day-head"><span class="day-num">${date.getDate()}</span><span class="day-name">${DAY_NAMES[(date.getDay()+6)%7]}</span></div>`;

        ['gym','food'].forEach(cat=>{
          const aRow=el('div','activity-row');
          const tag=el('span','activity-tag');
          tag.textContent=cat==='gym'?'G':'F';
          const on=Boolean(ds[cat]);
          const btn=document.createElement('button');
          btn.type='button';
          btn.className='toggle'+(on?' on':'');
          btn.setAttribute('aria-pressed',on);
          btn.setAttribute('title',`${esc(state.name)} · ${cat} · ${date.toDateString()}`);
          btn.textContent=on?'☀️':'🌧️';
          btn.addEventListener('click',()=>{
            ds[cat]=!ds[cat];
            btn.classList.toggle('on',ds[cat]);
            btn.setAttribute('aria-pressed',ds[cat]);
            btn.textContent=ds[cat]?'☀️':'🌧️';
            updateStats(year,month);scheduleSave();
          });
          aRow.append(tag,btn);
          dayEl.appendChild(aRow);
        });
        row.appendChild(dayEl);
      });

      row.appendChild(el('div','week-gap'));

      // Measure column (no header label, no date — already in week-label)
      const mCol=el('div','measure');

      // kg
      const kgDiv=el('div','measure-metric');
      kgDiv.innerHTML=`<div class="measure-metric-label">⚖️ kg</div>`;
      const kgInp=document.createElement('input');
      kgInp.className='measure-input kg-inp';kgInp.type='text';kgInp.inputMode='decimal';kgInp.placeholder='Gewicht';kgInp.value=state.measures[wk].kg||'';
      const kgBadge=el('span','rem-badge neutral');kgBadge.dataset.rem=wk;kgBadge.dataset.metric='kg';
      applyRemBadge(kgBadge,remKg(state.measures[wk].kg),' kg');
      kgInp.addEventListener('input',()=>{state.measures[wk].kg=kgInp.value;applyRemBadge(kgBadge,remKg(kgInp.value),' kg');renderCharts();scheduleSave();});
      kgDiv.append(kgInp,kgBadge);
      mCol.appendChild(kgDiv);

      // fat
      const fatDiv=el('div','measure-metric');
      fatDiv.innerHTML=`<div class="measure-metric-label">🔥 Körperfett</div>`;
      const fatInp=document.createElement('input');
      fatInp.className='measure-input fat-inp';fatInp.type='text';fatInp.inputMode='decimal';fatInp.placeholder='%';fatInp.value=state.measures[wk].fat||'';
      const fatBadge=el('span','rem-badge neutral');fatBadge.dataset.rem=wk;fatBadge.dataset.metric='fat';
      applyRemBadge(fatBadge,remFat(state.measures[wk].fat),'%');
      fatInp.addEventListener('input',()=>{state.measures[wk].fat=fatInp.value;applyRemBadge(fatBadge,remFat(fatInp.value),'%');renderCharts();scheduleSave();});
      fatDiv.append(fatInp,fatBadge);
      mCol.appendChild(fatDiv);

      row.appendChild(mCol);
      grid.appendChild(row);
    });

    scroll.appendChild(grid);sec.appendChild(scroll);root.appendChild(sec);
    updateStats(year,month);
  });
}

function updateStats(year,month){
  const box=document.querySelector(`[data-stats="${year}-${month}"]`);
  if(!box)return;
  const first=new Date(year,month,1),last=new Date(year,month+1,0);
  let gym=0,food=0;
  for(let d=new Date(first);d<=last;d.setDate(d.getDate()+1)){
    const ds=state.days[fmtDate(d)];
    if(ds?.gym)gym++;if(ds?.food)food++;
  }
  box.innerHTML=`<span class="stat"><b>${esc(state.name)}</b> · G&nbsp;${gym}/${last.getDate()} · F&nbsp;${food}/${last.getDate()}</span>`;
}

// ── Helpers ────────────────────────────────────────────
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function fmtDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pad(n){return String(n).padStart(2,'0');}
function weekNum(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}
function mondayOf(d){const r=new Date(d);r.setDate(r.getDate()-(r.getDay()+6)%7);r.setHours(0,0,0,0);return r;}
function getWeeks(year,month){
  const first=new Date(year,month,1),last=new Date(year,month+1,0);
  let cursor=mondayOf(first);const weeks=[];
  while(cursor<=last||cursor.getDay()!==1){
    const week=[];
    for(let i=0;i<7;i++){week.push(new Date(cursor));cursor.setDate(cursor.getDate()+1);}
    weeks.push(week);if(cursor>last&&cursor.getDay()===1)break;
  }
  return weeks;
}
function ensureDay(key){if(!state.days[key])state.days[key]={gym:false,food:false};return state.days[key];}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Init ──────────────────────────────────────────────
applyGoalsToUI();
renderCalendar();
renderCharts();
pullFromNotion();
</script>
